# NABZ — Netlify + Nitro (TanStack Start)
# Keep vite.config.ts preset as env override so Vercel/Liara presets stay intact.
[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# SSR entry: Nitro emits the server function; SPA/static files in dist still win when present.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
